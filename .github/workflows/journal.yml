name: Startogether journal
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
permissions:
  pull-requests: read
jobs:
  ownership:
    name: Startogether journal ownership
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Load validator from protected main
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          test "$TARGET_BRANCH" = main
          git clone --filter=blob:none --no-checkout --single-branch --branch main "https://github.com/$GITHUB_REPOSITORY.git" source
          cd source
          git merge-base --is-ancestor "$BASE_SHA" origin/main
          mkdir tools
          git show "${BASE_SHA}:tools/validate_pr.py" > tools/validate_pr.py
          git show "${BASE_SHA}:tools/new_entry.py" > tools/new_entry.py
      - name: Check PR metadata and Git objects
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/validate_pr.py

  report:
    name: Publish ownership result
    needs: ownership
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      statuses: write
    steps:
      - name: Attach decision to the exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ needs.ownership.result }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f context='Startogether / journal ownership' -f state="$state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
