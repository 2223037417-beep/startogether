name: Startogether journal
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, auto_merge_enabled]
permissions: {}
concurrency:
  group: journal-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  journal:
    if: github.event.pull_request.base.ref == 'main' || github.event.changes.base.ref.from == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: journal-bot
    steps:
      - name: Load trusted main without checking out PR content
        run: |
          git clone --filter=blob:none --no-checkout --single-branch --branch main "https://github.com/$GITHUB_REPOSITORY.git" source
          cd source
          mkdir tools
          for name in journal_bot validate_pr new_entry; do
            git show "origin/main:tools/$name.py" > "tools/$name.py"
          done
      - name: Create single-repository installation token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.JOURNAL_APP_ID }}
          private-key: ${{ secrets.JOURNAL_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: write
          permission-checks: read
      - name: Validate PR and merge eligible journal
        working-directory: source
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_ID: ${{ vars.JOURNAL_APP_ID }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: python3 tools/journal_bot.py
